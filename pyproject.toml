[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "render-master-bot"
version = "0.1.0"
description = "Local-first structured graphics planner and renderer orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "PapaJamz" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
]

[project.scripts]
render-master = "render_master_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
